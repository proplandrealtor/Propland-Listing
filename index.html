<!DOCTYPE html>



<html>

   <head>

<meta name="viewport" content="width=device-width, initial-scale=1">

      <base target="_top">

   </head>

   <body>

      <iframe style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;border: 0;" src="https://script.google.com/macros/s/AKfycbyyHUcH7OCkHtE77tOsjDAX_5PjdTPSd_XP5pb0n9eQbjPLUWe9wBjwBr4i0Aw5m0Uvew/exec"></iframe>


      <script>
// Disable right click
document.addEventListener('contextmenu', e => e.preventDefault());

// Disable console output
console.log = console.warn = console.error = console.debug = function() {};

// Block DevTools shortcuts
document.addEventListener('keydown', function(e) {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.metaKey && e.altKey && e.key === 'I')
  ) {
    e.preventDefault();
  }
});

// Safer: show overlay instead of wiping body
(function () {
  const threshold = 260; // เพิ่มให้ห่างขึ้นหน่อย ลด false positive
  let shown = false;

  setInterval(() => {
    const w = window.outerWidth - window.innerWidth;
    const h = window.outerHeight - window.innerHeight;

    const devtoolsLikely = (w > threshold || h > threshold);

    if (devtoolsLikely && !shown) {
      shown = true;
      const overlay = document.createElement('div');
      overlay.id = 'devtools-overlay';
      overlay.style.cssText =
        'position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:999999;font-family:system-ui;';
      overlay.textContent = 'Access restricted';
      document.body.appendChild(overlay);
    }

    if (!devtoolsLikely && shown) {
      shown = false;
      document.getElementById('devtools-overlay')?.remove();
    }
  }, 800);
})();

</script>


   </body>

</html>
