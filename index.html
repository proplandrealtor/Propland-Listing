<!DOCTYPE html>



<html>

   <head>

<meta name="viewport" content="width=device-width, initial-scale=1">

      <base target="_top">

   </head>

   <body>

      <iframe style="position: absolute;top: 0;left: 0;width: 100%;height: 100%;border: 0;" src="https://script.google.com/macros/s/AKfycbzX_s-4HqdH-smj-Df3Qh7MRSQrBdaaJUMK0LHWWSzlg9N34zMvGIMvvkPsIKqOFzagEg/exec"></iframe>


      <script>
// Disable right click
document.addEventListener('contextmenu', e => e.preventDefault());

// Disable console output
console.log = console.warn = console.error = console.debug = function() {};

// Block DevTools shortcuts
document.addEventListener('keydown', function(e) {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) ||
    (e.metaKey && e.altKey && e.key === 'I')
  ) {
    e.preventDefault();
  }
});

// Detect DevTools
(function() {
  const threshold = 160;
  setInterval(() => {
    if (
      window.outerWidth - window.innerWidth > threshold ||
      window.outerHeight - window.innerHeight > threshold
    ) {
      document.body.innerHTML = '';
    }
  }, 500);
})();
</script>


   </body>

</html>
